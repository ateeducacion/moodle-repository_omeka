  #     - ./data:/data:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M

  # The alpine-chromium image includes Chrome + Chromedriver
  chrome:
    image: ghcr.io/erseco/alpine-chromedriver:latest
    container_name: chrome
    hostname: chrome
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "9515:9515" # Expose Chromedriver

volumes:
  moodledata:
  dbdata:
  # omekas_data:
