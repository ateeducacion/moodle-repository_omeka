
services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Primary DB for Moodle; Omeka DB will be created via init SQL below
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
    volumes:
      - dbdata:/var/lib/mysql
      # Creates the Omeka DB + user on first run
      - ./docker/mysql-init/02-create-omeka.sql:/docker-entrypoint-initdb.d/02-create-omeka.sql:ro

  moodle:
    image: erseco/alpine-moodle:v5.0.5
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "80:8080"
    environment:
      DB_TYPE: mariadb
      DB_HOST: mariadb
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      DB_PORT: 3306
      DB_PREFIX: mdl_
      DEBUG: "true"
      MOODLE_EMAIL: admin@example.com
      MOODLE_LANGUAGE: es
      MOODLE_SITENAME: Moodle-Omeka
      MOODLE_USERNAME: admin@example.com
      MOODLE_PASSWORD: PLEASE_CHANGEME
      PRE_CONFIGURE_COMMANDS: |
        echo 'This is a pre-configure command'
      OMEKA_BASEURL: https://dev.omeka.org/omeka-s-sandbox
      POST_CONFIGURE_COMMANDS: |
        echo '== Running Moodle upgrade =='
        php admin/cli/upgrade.php --non-interactive
        echo '== Ensuring "Test Courses" category and demo course =='
        if ! moosh course-list "shortname='OMEKA01'" | grep -q 'OMEKA01'; then
          moosh course-create --category 1 --fullname "Omeka Repository Test Course" --shortname "OMEKA01"
        fi
        echo '== Enabling repository_omeka and creating Omeka Sandbox instance =='
        php -d display_errors=1 -r '
          define("CLI_SCRIPT", true);
          require("/var/www/html/config.php");
          $baseurl = getenv("OMEKA_BASEURL") ?: "https://dev.omeka.org/omeka-s-sandbox";
          $now = time();
          // Repository type row: ensure it exists, visible, with sortorder.
          $row = $DB->get_record("repository", ["type" => "omeka"]);
          if ($row) {
              $typeid = (int)$row->id;
              $DB->set_field("repository", "visible", 1, ["id" => $typeid]);
          } else {
              $max = (int)$DB->get_field_sql("SELECT MAX(sortorder) FROM {repository}");
              $rec = (object)["type" => "omeka", "visible" => 1, "sortorder" => $max + 1];
              $typeid = (int)$DB->insert_record("repository", $rec);
          }
          // Plugin-level options (equivalent to ticking both boxes on /admin/repository.php).
          set_config("enablecourseinstances", 1, "omeka");
          set_config("enableuserinstances", 1, "omeka");
          // System-context instance pointing at the configured Omeka URL.
          $ctx = context_system::instance();
          $existing = $DB->get_record("repository_instances", [
              "typeid" => $typeid, "contextid" => $ctx->id,
          ]);
          if (!$existing) {
              $inst = (object)[
                  "name" => "Omeka Sandbox", "typeid" => $typeid, "userid" => 0,
                  "contextid" => $ctx->id, "username" => "", "password" => "",
                  "timecreated" => $now, "timemodified" => $now, "readonly" => 0,
              ];
              $instanceid = (int)$DB->insert_record("repository_instances", $inst);
              foreach ([
                  "baseurl" => $baseurl, "siteid" => "0",
                  "keyidentity" => "", "keycredential" => "",
                  "acceptedtypes" => "", "sitelabel" => "", "siteslug" => "",
              ] as $n => $v) {
                  $DB->insert_record("repository_instance_config",
                      (object)["instanceid" => $instanceid, "name" => $n, "value" => $v]);
              }
              echo "Omeka Sandbox instance created (typeid=$typeid, instanceid=$instanceid) -> $baseurl" . PHP_EOL;
          } else {
              echo "Omeka Sandbox instance already exists (typeid=$typeid, instanceid={$existing->id})" . PHP_EOL;
          }
        '
        echo '== Ensuring admin is enrolled as editingteacher in OMEKA01 =='
        moosh course-enrol -r editingteacher OMEKA01 admin || true

    volumes:
      - moodledata:/var/moodledata
      # Example: expose an “omeka” repository folder inside Moodle (optional)
      - .:/var/www/html/repository/omeka

